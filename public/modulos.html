<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141020">
<meta name="description" content="Módulos para Content OS: espía de competencia, métricas, ideas y guiones, secuencias de historias y variantes de un video ganador.">
<title>Content OS Módulos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#141020; --bg2:#0e0b18; --surface:#1c1729; --surface2:#241d35; --surface3:#2d2442;
  --line:#342a4c; --line-soft:#271f3c;
  --text:#ece7f7; --text2:#a99cc4; --text3:#7a6e96;
  --accent:#a78bfa; --accent-strong:#8b5cf6; --accent-dim:rgba(167,139,250,.13); --accent-line:rgba(167,139,250,.34);
  --mag:#f472b6; --ok:#4ade80; --warn:#fbbf24; --crit:#fb7185;
  --r:12px; --r-s:8px;
  --ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:"Bricolage Grotesque","IBM Plex Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 78% -12%,rgba(139,92,246,.16),transparent 62%),
             radial-gradient(700px 460px at 4% 104%,rgba(244,114,182,.07),transparent 60%);}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:700;text-wrap:balance;letter-spacing:-.015em}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#33294a;border-radius:20px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:238px minmax(0,1fr);height:100vh}
.side{background:rgba(20,16,32,.82);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 12px}
.brand .glyph{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent-strong),#c084fc);box-shadow:0 4px 14px rgba(139,92,246,.35);font-size:15px}
.brand b{font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;font-size:10px;color:var(--text3);letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin-top:1px}
.navwrap{flex:1;overflow-y:auto;padding:6px 10px 10px;min-height:0}
.navlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);padding:14px 8px 6px;font-weight:600}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;
  background:none;border:0;color:var(--text2);cursor:pointer;font-size:13.5px;font-weight:500;transition:background .13s,color .13s}
.navitem span.ico{width:17px;text-align:center;font-size:14px;filter:saturate(.9)}
.navitem:hover{background:var(--surface2);color:var(--text)}
.navitem.on{background:var(--accent-dim);color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.navitem .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text3);background:var(--surface2);padding:1px 6px;border-radius:20px}
.navitem.on .count{background:rgba(167,139,250,.2);color:var(--accent)}
.sidefoot{padding:10px;border-top:1px solid var(--line-soft)}

.main{overflow-y:auto;min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding:30px 34px 90px}
.phead{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px}
.phead .pico{font-size:27px;line-height:1.1}
.phead h1{font-size:29px}
.phead p{margin:3px 0 0;color:var(--text2);font-size:13.5px;max-width:62ch}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.phead .ptxt{flex:1 1 auto;min-width:0}
@media(max-width:820px){
  .phead{flex-wrap:wrap}
  .phead .ptxt{flex:1 1 100%}
  .phead .acts{margin-left:0;flex-basis:100%;justify-content:flex-start}
}

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;transition:.13s;white-space:nowrap}
.btn:hover{background:var(--surface3);border-color:var(--accent-line)}
.btn:focus-visible,.navitem:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:linear-gradient(160deg,var(--accent-strong),#7c3aed);border-color:transparent;color:#fff;font-weight:600;
  box-shadow:0 3px 12px rgba(124,58,237,.34)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px}
.lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);font-weight:600}
.sect{margin-top:30px}
.sect>.lab{display:block;margin-bottom:11px}
.grid{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  padding:2.5px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--line-soft);color:var(--text2);text-transform:uppercase;font-weight:500}
.chip.ac{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.chip.ok{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.3);color:var(--ok)}
.chip.wr{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);color:var(--warn)}
.chip.cr{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.3);color:var(--crit)}
.chip.mg{background:rgba(244,114,182,.12);border-color:rgba(244,114,182,.3);color:var(--mag)}
.muted{color:var(--text2)}
.dim{color:var(--text3)}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:30px 22px;text-align:center;color:var(--text3);font-size:13px}
.empty b{display:block;color:var(--text2);font-family:var(--disp);font-size:15px;margin-bottom:5px;font-weight:600}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;font-size:13.5px;transition:border-color .13s}
input:focus,select:focus,textarea:focus{border-color:var(--accent-line)}
input::placeholder,textarea::placeholder{color:#5d5379}
textarea{resize:vertical;min-height:70px;line-height:1.55}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.fgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.f2{grid-column:span 2}
@media(max-width:760px){.f2{grid-column:span 1}}

/* stat tiles */
.tiles{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 14px}
.tile .v{font-family:var(--disp);font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11.5px;color:var(--text3);margin-top:2px}
.tile.hi{background:linear-gradient(155deg,rgba(139,92,246,.15),var(--surface) 62%);border-color:var(--accent-line)}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);font-weight:600;
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg2)}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
td.n{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;min-width:44px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-strong),var(--mag));border-radius:3px}

/* split layout */
.split{display:grid;grid-template-columns:266px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{position:fixed;z-index:40;inset:0 auto 0 0;width:238px;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)} .mobtog{display:inline-flex!important} .wrap{padding:62px 16px 80px}}
.mobtog{display:none;position:fixed;z-index:41;left:12px;top:12px}
.rail{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:2px;max-height:none}
.railitem{display:flex;gap:9px;align-items:center;padding:8px 9px;border-radius:9px;background:none;border:0;cursor:pointer;text-align:left;width:100%;color:var(--text2);transition:.12s}
.railitem:hover{background:var(--surface2);color:var(--text)}
.railitem.on{background:var(--accent-dim);color:#fff}
.railitem .t{font-weight:600;font-size:13.5px;display:block;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railitem .m{font-size:11px;color:var(--text3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railitem.on .m{color:#bcaee0}
.av{width:28px;height:28px;border-radius:8px;flex:0 0 28px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:12px;color:#fff;
  background:linear-gradient(150deg,var(--accent-strong),var(--mag))}

/* item cards */
.item{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 14px;display:flex;gap:12px;align-items:flex-start}
.item h4{font-size:14.5px;font-weight:600;font-family:var(--ui);letter-spacing:0}
.item .body{flex:1;min-width:0}
.item .acts{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:180px}
.item p{margin:5px 0 0;font-size:12.5px;color:var(--text2)}

/* modal */
.mask{position:fixed;inset:0;background:rgba(8,6,14,.72);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);max-height:88vh;overflow:auto;
  box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--surface);z-index:2}
.modal header h3{font-size:17px}
.modal .bd{padding:18px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line-soft);position:sticky;bottom:0;background:var(--surface)}
.x{margin-left:auto;background:none;border:0;color:var(--text3);cursor:pointer;font-size:19px;line-height:1;padding:3px 6px;border-radius:6px}
.x:hover{background:var(--surface2);color:var(--text)}

/* prompt box */
.prompt{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-family:var(--mono);font-size:12px;
  line-height:1.62;white-space:pre-wrap;max-height:420px;overflow:auto;color:#cdc3e4}
.hint{font-size:12px;color:var(--text3);line-height:1.55}
.hint b{color:var(--text2);font-weight:600}

/* stories */
.slides{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(186px,1fr))}
.slide{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.slide .ph{position:relative;aspect-ratio:9/16;background:var(--bg2);display:grid;place-items:center;overflow:hidden}
.slide .ph img{width:100%;height:100%;object-fit:cover;display:block}
.slide .ph .no{color:var(--text3);font-size:11.5px;text-align:center;padding:12px;line-height:1.5}
.slide .ph .idx{position:absolute;top:7px;left:7px;font-family:var(--mono);font-size:10px;background:rgba(10,8,16,.8);
  padding:2px 7px;border-radius:20px;color:var(--accent);border:1px solid var(--accent-line);font-weight:600}
.slide .ph .ov{position:absolute;left:0;right:0;bottom:0;padding:10px 9px;font-size:11.5px;line-height:1.42;
  background:linear-gradient(transparent,rgba(8,6,14,.9));color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.slide .cf{padding:7px 6px;display:flex;gap:3px;justify-content:space-between;border-top:1px solid var(--line-soft)}
.slide .cf .btn{padding:4px 6px;font-size:12px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--text3);font-size:13px;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-dim);color:var(--text2)}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--surface3);border:1px solid var(--accent-line);border-radius:10px;padding:10px 14px;font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .22s ease-out;max-width:340px}
.toast.bad{border-color:rgba(251,113,133,.5)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<button class="btn mobtog" id="mobtog" aria-label="Abrir menú">☰</button>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="glyph">◈</div>
      <div><b>Content OS</b><small>Módulos</small></div>
    </div>
    <div class="navwrap" id="nav"></div>
    <div class="sidefoot">
      <!-- Vuelta al Content OS principal: sin esto se entra acá y no hay
           forma de salir más que el botón de atrás del navegador. -->
      <a class="btn ghost sm" style="width:100%;justify-content:center;margin-bottom:6px;text-decoration:none" href="/">← Volver a Content OS</a>
      <button class="btn ghost sm" style="width:100%;justify-content:center" data-go="datos">⚙️ Datos y respaldo</button>
    </div>
  </aside>
  <main class="main" id="main"><div class="wrap" id="view"></div></main>
</div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script>
(function(){
"use strict";

/* ══════════════ 1. Base ══════════════ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.prototype.slice.call(r.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nn=v=>{const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(/\./g,'').replace(',','.'));return isFinite(n)?n:0;};
const fmt=n=>{n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1).replace('.',',')+'M':n>=1e4?Math.round(n/1e3)+' mil':n>=1e3?(n/1e3).toFixed(1).replace('.',',')+' mil':String(Math.round(n));};
const pct=n=>(Number(n)||0).toFixed(1).replace('.',',')+'%';
const hoy=()=>new Date().toISOString().slice(0,10);
const fecha=d=>{if(!d)return '—';const p=String(d).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0].slice(2):d;};
const lines=a=>a.filter(Boolean).join('\n');

const KEY='contentos_modulos_v1';
const VACIO={
  marca:{nombre:'',nicho:'',audiencia:'',tono:'Rioplatense, directo, sin vueltas',pilares:'',oferta:'',cta:'',prohibido:''},
  refs:[], posts:[], biblio:[], secuencias:[], variantes:[]
};
let S=cargar();

function cargar(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(VACIO));
    const d=JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(VACIO)),d);
  }catch(e){ return JSON.parse(JSON.stringify(VACIO)); }
}
let guardarT=null;
function guardar(inmediato){
  clearTimeout(guardarT);
  const go=()=>{
    try{ localStorage.setItem(KEY,JSON.stringify(S)); }
    catch(e){ toast('No entró en la memoria del navegador. Bajá un respaldo en Datos y borrá alguna secuencia con muchas fotos.',true); }
  };
  if(inmediato) go(); else guardarT=setTimeout(go,320);
}

function toast(msg,bad){
  const t=document.createElement('div');
  t.className='toast'+(bad?' bad':''); t.textContent=msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),320);},bad?4600:2400);
}

async function copiar(txt,label){
  try{ await navigator.clipboard.writeText(txt); toast((label||'Copiado')+' ✓'); return true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast((label||'Copiado')+' ✓'); }
    catch(e2){ toast('No pude copiar. Seleccioná el texto a mano.',true); }
    ta.remove(); return true;
  }
}

/* descarga: usa la capacidad del visor si existe, si no un enlace normal */
let capDL; 
async function getDL(){ if(capDL!==undefined) return capDL; capDL=null;
  try{ if(window.claude&&window.claude.use) capDL=await window.claude.use('downloads'); }catch(e){}
  return capDL;
}
async function bajar(nombre,blob){
  const ext=(nombre.split('.').pop()||'').toLowerCase();
  const dl=await getDL();
  if(dl){
    try{ await dl.save({filename:nombre,data:blob}); toast('Descargado ✓'); return true; }
    catch(err){
      const c=err&&err.code;
      if(c==='declined') return false;
      if(c==='rejected_extension'||c==='extension_not_enabled'){
        toast('Acá el visor no deja bajar .'+ext+'. Abrí el módulo desde tu dashboard en Netlify y ahí sí funciona.',true);
        return false;
      }
      toast('No se pudo descargar: '+(err&&err.message||'error'),true); return false;
    }
  }
  try{
    const u=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=u; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000); toast('Descargado ✓'); return true;
  }catch(e){ toast('El navegador bloqueó la descarga.',true); return false; }
}

/* ══════════════ 2. ZIP (store, sin dependencias) ══════════════ */
const CRC=(function(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){
  const enc=new TextEncoder(), locals=[], centrals=[]; let off=0;
  files.forEach(f=>{
    const name=enc.encode(f.name), data=f.data, crc=crc32(data), sz=data.length;
    const lh=new Uint8Array(30+name.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0x2100,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,sz,true); dv.setUint32(22,sz,true);
    dv.setUint16(26,name.length,true); dv.setUint16(28,0,true); lh.set(name,30);
    locals.push(lh,data);
    const ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0x2100,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,sz,true); cv.setUint32(24,sz,true);
    cv.setUint16(28,name.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true); cv.setUint32(42,off,true);
    ch.set(name,46); centrals.push(ch);
    off+=lh.length+sz;
  });
  let cdSize=0; centrals.forEach(c=>cdSize+=c.length);
  const eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(4,0,true); ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,off,true); ev.setUint16(20,0,true);
  return new Blob(locals.concat(centrals,[eo]),{type:'application/zip'});
}
function dataURLaBytes(u){
  const b64=String(u).split(',')[1]||''; const bin=atob(b64);
  const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
  return out;
}

function topPosts(n){
  return S.posts.slice().map(p=>Object.assign({},p,{eng:engagement(p)}))
    .sort((a,b)=>(nn(b.views)-nn(a.views))).slice(0,n||3);
}
function engagement(p){
  const v=nn(p.views); if(!v) return 0;
  return ((nn(p.likes)+nn(p.coments)+nn(p.guardados)+nn(p.compartidos))/v)*100;
}
function ctxMarca(opts){
  opts=opts||{};
  const m=S.marca, L=[];
  L.push('## MI MARCA');
  L.push('- Cuenta / marca: '+(m.nombre||'(sin cargar)'));
  if(m.nicho) L.push('- Nicho: '+m.nicho);
  if(m.audiencia) L.push('- A quién le hablo: '+m.audiencia);
  if(m.tono) L.push('- Tono de voz: '+m.tono);
  if(m.pilares) L.push('- Pilares de contenido: '+m.pilares.split(/\n|,/).map(s=>s.trim()).filter(Boolean).join(' | '));
  if(m.oferta) L.push('- Qué vendo / a qué quiero llevar: '+m.oferta);
  if(m.cta) L.push('- CTAs que uso: '+m.cta);
  if(m.prohibido) L.push('- Nunca hacer: '+m.prohibido);

  if(opts.top!==false){
    const t=topPosts(4);
    if(t.length){
      L.push(''); L.push('## LO QUE MEJOR ME FUNCIONÓ (datos reales)');
      t.forEach(p=>L.push('- "'+(p.titulo||'sin título')+'" ('+(p.formato||'—')+', '+(p.plataforma||'—')+') — '+
        fmt(nn(p.views))+' views, '+pct(p.eng)+' de engagement'+(p.hook?' — hook: "'+p.hook+'"':'')));
    }
  }
  if(opts.biblio!==false){
    const h=S.biblio.filter(b=>b.tipo==='hook').slice(0,8);
    if(h.length){ L.push(''); L.push('## HOOKS DE MI BANCO (para que copies mi voz)');
      h.forEach(b=>L.push('- '+(b.texto||b.titulo))); }
    const g=S.biblio.filter(b=>b.tipo==='guion'||b.tipo==='transcripcion').slice(0,2);
    if(g.length){ L.push(''); L.push('## MUESTRA DE MI FORMA DE ESCRIBIR');
      g.forEach(b=>L.push('---\n'+String(b.texto||'').slice(0,900))); }
  }
  return lines(L);
}

VISTAS.metricas=function(){
  const ps=S.posts.slice().sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));
  const tot=ps.reduce((a,p)=>({v:a.v+nn(p.views),l:a.l+nn(p.likes),c:a.c+nn(p.coments),g:a.g+nn(p.guardados),s:a.s+nn(p.compartidos),f:a.f+nn(p.seguidores)}),{v:0,l:0,c:0,g:0,s:0,f:0});
  const engProm=ps.length?ps.reduce((a,p)=>a+engagement(p),0)/ps.length:0;
  const rank=ps.slice().sort((a,b)=>engagement(b)-engagement(a)).slice(0,5);
  const maxV=Math.max(1,...ps.map(p=>nn(p.views)));

  let h=head('📊','Métricas','Cargá cada publicación con sus números. De acá salen el ranking, las variantes y el contexto que la IA usa para todo lo demás.',
    '<button class="btn" id="mt_ia" '+(ps.length?'':'disabled')+'>✨ Analizar con IA</button><button class="btn pri" id="mt_new">+ Publicación</button>');

  h+='<div class="tiles">'+
    tile('Publicaciones',ps.length,ps.length?'cargadas':'todavía nada',1)+
    tile('Visualizaciones',fmt(tot.v),'suma total')+
    tile('Engagement promedio',ps.length?pct(engProm):'—','interacciones / views')+
    tile('Guardados',fmt(tot.g),'la señal que más pesa')+
    tile('Compartidos',fmt(tot.s),'alcance nuevo')+
    tile('Seguidores generados',fmt(tot.f),'atribuidos a posts')+
  '</div>';

  if(!ps.length){
    h+='<div class="sect">'+vacio('Todavía no cargaste ninguna publicación',
      'Cargá los últimos 10 posts con sus números. Con eso ya podés ver qué funcionó, generar variantes y darle contexto real a la IA.',
      '<button class="btn pri" id="mt_new2">+ Cargar la primera</button>')+'</div>';
    return h;
  }

  h+='<div class="sect"><span class="lab">Lo que mejor funcionó · por engagement</span><div class="grid">'+
    rank.map((p,i)=>'<div class="item"><div class="av" style="background:'+(i===0?'linear-gradient(150deg,#8b5cf6,#f472b6)':'var(--surface3)')+'">'+(i+1)+'</div>'+
      '<div class="body"><h4>'+esc(p.titulo||'Sin título')+'</h4>'+
      '<div class="row" style="margin-top:6px;gap:6px">'+
        '<span class="chip">'+esc(p.formato||'—')+'</span><span class="chip">'+esc(p.plataforma||'—')+'</span>'+
        (p.pilar?'<span class="chip ac">'+esc(p.pilar)+'</span>':'')+
        '<span class="chip ok">'+pct(engagement(p))+'</span><span class="chip">'+fmt(nn(p.views))+' views</span></div>'+
      (p.hook?'<p>“'+esc(p.hook)+'”</p>':'')+'</div>'+
      '<div class="acts"><button class="btn sm" data-var="'+p.id+'">♻️ Variantes</button></div></div>').join('')+
  '</div></div>';

  h+='<div class="sect"><span class="lab">Todas las publicaciones</span><div class="tblwrap"><table><thead><tr>'+
    '<th>Publicación</th><th>Fecha</th><th>Formato</th><th>Views</th><th>Alcance relativo</th><th>Eng.</th><th>Guard.</th><th>Segs.</th><th></th>'+
    '</tr></thead><tbody>'+
    ps.map(p=>'<tr><td><b style="font-weight:600">'+esc(p.titulo||'Sin título')+'</b>'+(p.plataforma?'<div class="dim" style="font-size:11.5px">'+esc(p.plataforma)+(p.cliente?' · '+esc(p.cliente):'')+'</div>':'')+'</td>'+
      '<td class="n dim">'+fecha(p.fecha)+'</td><td><span class="chip">'+esc(p.formato||'—')+'</span></td>'+
      '<td class="n">'+fmt(nn(p.views))+'</td>'+
      '<td><div class="bar"><i style="width:'+Math.max(3,Math.round(nn(p.views)/maxV*100))+'%"></i></div></td>'+
      '<td class="n">'+pct(engagement(p))+'</td><td class="n">'+fmt(nn(p.guardados))+'</td><td class="n">'+fmt(nn(p.seguidores))+'</td>'+
      '<td style="white-space:nowrap"><button class="btn sm ghost" data-edit="'+p.id+'">Editar</button> <button class="btn sm ghost danger" data-del="'+p.id+'">✕</button></td></tr>').join('')+
  '</tbody></table></div></div>';
  return h;
};

const TRANSFORMS=[
  ['La objeción','Poné en boca del espectador la objeción exacta que resuelve el video.',h=>'"'+corto(h)+'"… eso me dijo un cliente antes de firmar.'],
  ['El error caro','Mismo contenido, encuadrado como el error que le está costando plata.',h=>'El error que te está costando ventas: '+minus(corto(h))+'.'],
  ['Contra-opinión','Arrancá negando lo que todos repiten sobre el tema.',h=>'Todos dicen que '+minus(corto(h))+'. Están equivocados.'],
  ['Lista numerada','Convertí el mismo tema en una lista rápida y concreta.',h=>'3 cosas que nadie te dice sobre '+minus(corto(h))+'.'],
  ['POV / dramatización','Actuá la escena en vez de explicarla.',h=>'POV: '+minus(corto(h))+' y no sabés qué contestar.'],
  ['Antes y después','Mostrá el contraste entre cómo lo hacías y cómo lo hacés ahora.',h=>'Así lo hacía antes. Así lo hago ahora. La diferencia son '+minus(corto(h))+'.'],
  ['Caso real','El mismo aprendizaje contado como el caso de un cliente concreto.',h=>'Un cliente me escribió por esto. Lo que pasó después te va a sorprender.'],
  ['Mito vs verdad','Desarmá la creencia que rodea al tema.',h=>'Mito: '+minus(corto(h))+'. Verdad: casi nunca es así.'],
  ['La pregunta','Abrí con la pregunta que la gente no se anima a hacer.',h=>'¿'+cap(minus(corto(h)))+'? Nadie te lo va a decir con esta claridad.'],
  ['La analogía','Explicá lo mismo con una comparación de la vida cotidiana.',h=>'Esto es como ir al gimnasio una vez y esperar el cuerpo. Con '+minus(corto(h))+' pasa igual.']
];
function corto(s){ s=String(s||'').replace(/\s+/g,' ').trim().replace(/[.!?]+$/,''); return s.length>72?s.slice(0,72).replace(/\s\S*$/,'')+'…':s||'este tema'; }
function minus(s){ return s.charAt(0).toLowerCase()+s.slice(1); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

const STICKERS=['','Encuesta','Pregunta','Cuenta regresiva','Quiz','Deslizá para arriba','Link','Emoji slider','Música'];
function limpiarNombre(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9\-_ ]/g,'').trim().replace(/\s+/g,'-').slice(0,40)||'historia'; }

async function comprimirImagen(file){
  const url=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const maxW=1080, maxH=1920;
  let w=img.naturalWidth, h=img.naturalHeight;
  const k=Math.min(1,maxW/w,maxH/h); w=Math.round(w*k); h=Math.round(h*k);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',0.82);
}

function mover(sec,id,d){
  const i=sec.slides.findIndex(s=>s.id===id), j=i+d;
  if(i<0||j<0||j>=sec.slides.length) return;
  const t=sec.slides[i]; sec.slides[i]=sec.slides[j]; sec.slides[j]=t;
  guardar(true); pintar();
}

  toast('Procesando '+arr.length+' foto'+(arr.length>1?'s':'')+'…');

    try{ sec.slides.push({id:uid(),img:await comprimirImagen(f),nombre:f.name}); }
    catch(e){ toast('No pude leer '+f.name,true); }

  const s=sec.slides.find(x=>x.id===id); if(!s) return;
  const i=sec.slides.indexOf(s);
  modal('Historia '+String(i+1).padStart(2,'0'),'<div class="fgrid">'+
    campo('Texto en pantalla',ta('sl_texto',s.texto,'Lo que va escrito sobre la foto. Corto: en historias nadie lee párrafos.',80),1)+
    campo('CTA',inp('sl_cta',s.cta,'Deslizá para arriba'))+
    campo('Sticker',sel('sl_sticker',s.sticker||'',STICKERS))+
    campo('Duración',inp('sl_dur',s.dur,'5 seg'))+
    campo('Link de la foto (Drive, Dropbox, etc.)',inp('sl_link',s.link,'https://…','url'))+
    campo('Nota de producción',ta('sl_nota',s.nota,'Grabar en el escritorio, luz de ventana.',60),1)+
  '</div>'+(s.img?'<div class="row" style="margin-top:14px"><button class="btn sm ghost" id="sl_bajar">⬇️ Bajar esta foto</button>'+
    '<button class="btn sm ghost danger" id="sl_quitar">Quitar foto</button></div>':''),
  '<button class="btn ghost" data-cerrar>Cancelar</button><button class="btn pri" id="sl_ok">Guardar</button>',
  m=>{
    m.querySelector('#sl_ok').onclick=()=>{
      ['texto','cta','sticker','dur','link','nota'].forEach(k=>{ s[k]=m.querySelector('#sl_'+k).value.trim(); });
      guardar(true); cerrarModal(); pintar(); toast('Guardada ✓');
    };
    const bj=m.querySelector('#sl_bajar');
    if(bj) bj.onclick=()=>bajar(limpiarNombre(sec.nombre)+'-'+String(i+1).padStart(2,'0')+'.jpg',new Blob([dataURLaBytes(s.img)],{type:'image/jpeg'}));
    const q=m.querySelector('#sl_quitar');
    if(q) q.onclick=()=>{ delete s.img; guardar(true); cerrarModal(); pintar(); toast('Foto quitada'); };
  });
}
function guionTexto(sec){
  const L=['SECUENCIA DE HISTORIAS','='.repeat(46),sec.nombre||'Sin nombre',
    'Fecha: '+fecha(sec.fecha)+(sec.cliente?'   Cliente: '+sec.cliente:''),
    'Historias: '+sec.slides.length];
  if(sec.objetivo) L.push('','Objetivo: '+sec.objetivo);
  L.push('','='.repeat(46),'');
  sec.slides.forEach((s,i)=>{
    L.push('── HISTORIA '+String(i+1).padStart(2,'0')+' ──');
    L.push('Foto: '+(s.img?String(i+1).padStart(2,'0')+'.jpg':(s.link?s.link:'(sin foto)')));
    if(s.texto) L.push('Texto en pantalla: '+s.texto);
    if(s.cta) L.push('CTA: '+s.cta);
    if(s.sticker) L.push('Sticker: '+s.sticker);
    if(s.dur) L.push('Duración: '+s.dur);
    if(s.nota) L.push('Nota: '+s.nota);
    L.push('');
  });
  L.push('Generado con Content OS · Módulos');
  return L.join('\n');
}
async function exportarZip(sec){
  if(!sec.slides.length) return;
  const base=limpiarNombre(sec.nombre);
  const files=[];
  sec.slides.forEach((s,i)=>{
    if(s.img) files.push({name:String(i+1).padStart(2,'0')+'.jpg',data:dataURLaBytes(s.img)});
  });
  files.push({name:'guion.txt',data:new TextEncoder().encode(guionTexto(sec))});
  try{ await bajar(base+'.zip',zip(files)); }
  catch(e){ toast('No pude armar el ZIP: '+e.message,true); }
}

/* ══════════════ 12. Datos y respaldo ══════════════ */
VISTAS.datos=function(){
  let bytes=0; try{ bytes=(localStorage.getItem(KEY)||'').length; }catch(e){}
  const mb=(bytes/1048576);
  return head('⚙️','Datos y respaldo','Todo se guarda en este navegador, en esta computadora. Bajate un respaldo cada tanto y para pasarlo a otro dispositivo.')+
  '<div class="tiles">'+
    tile('Referentes',S.refs.length,'con '+S.refs.reduce((a,r)=>a+((r.videos||[]).length),0)+' videos')+
    tile('Publicaciones',S.posts.length,'en métricas')+
    tile('Banco',S.biblio.length,'hooks, guiones, CTAs')+
    tile('Secuencias',S.secuencias.length,S.secuencias.reduce((a,s)=>a+((s.slides||[]).length),0)+' historias')+
    tile('Variantes',S.variantes.length,'generadas')+
    tile('Espacio usado',mb<0.1?Math.round(bytes/1024)+' KB':mb.toFixed(1)+' MB',mb>3.5?'⚠️ cerca del límite':'de ~5 MB disponibles',mb>3.5)+
  '</div>'+
  '<div class="sect"><span class="lab">Respaldo</span><div class="card"><div class="row">'+
    '<button class="btn pri" id="d_exp">⬇️ Bajar respaldo (.json)</button>'+
    '<button class="btn" id="d_imp">⬆️ Restaurar desde archivo</button>'+
    '<input type="file" id="d_file" accept="application/json,.json" hidden>'+
    '<button class="btn ghost danger" id="d_wipe" style="margin-left:auto">Borrar todo</button>'+
  '</div><p class="hint" style="margin:12px 0 0">El respaldo trae todo, fotos incluidas. Sirve para pasar tus datos entre navegadores o dispositivos que también usen esta pantalla — no se conecta con tu dashboard de Content OS, que guarda todo aparte.</p></div></div>'+
  '<div class="sect"><span class="lab">Dónde vive esto</span><div class="card"><p class="hint" style="margin:0">'+
    'Nada sale de tu navegador: no hay servidor ni cuenta. Si borrás los datos del sitio o entrás desde otra computadora, no vas a ver nada — por eso el respaldo. '+
    'Las fotos de las secuencias son lo que más pesa; si te acercás al límite, exportá el ZIP y borrá la secuencia vieja.</p></div></div>';
};
VISTAS.datos_mount=function(){
  $('#d_exp').onclick=()=>bajar('content-os-respaldo-'+hoy()+'.json',
    new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  $('#d_imp').onclick=()=>$('#d_file').click();
  $('#d_file').onchange=function(){
    const f=this.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(typeof d!=='object'||!d) throw new Error('formato');
        confirmar('Restaurar reemplaza todo lo que tenés cargado ahora. ¿Seguimos?',()=>{
          S=Object.assign(JSON.parse(JSON.stringify(VACIO)),d);
          guardar(true); pintarNav(); pintar(); toast('Restaurado ✓');
        });
      }catch(e){ toast('Ese archivo no es un respaldo válido.',true); }
    };
    r.readAsText(f); this.value='';
  };
  $('#d_wipe').onclick=()=>confirmar('Esto borra referentes, métricas, banco, secuencias y variantes. No se puede deshacer.',()=>{
    S=JSON.parse(JSON.stringify(VACIO)); guardar(true); ctx={}; pintarNav(); pintar(); toast('Todo borrado');
  });
};

/* ══════════════ 13. Arranque ══════════════ */
pintarNav(); pintar();
window.addEventListener('beforeunload',()=>guardar(true));
})();
